name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      # Nothing below this line runs if a check fails, so a tag can no longer
      # publish a release that does not build, does not pass its tests, or
      # names a version the plugin itself does not claim.
      - name: Check the tag matches manifest.json and package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./manifest.json').version")
          package=$(node -p "require('./package.json').version")
          echo "tag=$tag manifest=$manifest package=$package"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $manifest"
            exit 1
          fi
          if [ "$tag" != "$package" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $package"
            exit 1
          fi

      - name: Run tests
        run: npx vitest run

      - name: Run lint
        run: npm run lint

      - run: npm run build

      - name: Attest main.js
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/main.js

      - name: Attest styles.css
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: styles.css

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: ${{ github.event.head_commit.message }}
          files: |
            dist/main.js
            dist/manifest.json
            styles.css
