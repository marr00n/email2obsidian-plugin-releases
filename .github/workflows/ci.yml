name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # vitest run, not the watch-mode `npm test`, which never exits.
      - run: npm run test:ci

      - run: npm run typecheck

      - run: npm run build
